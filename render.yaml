services:
  - type: web
    name: backend
    env: node
    plan: free
    nodeVersion: 18
    buildCommand: |
      npm ci --ignore-scripts
      npm run build
      npm prune --production
    startCommand: npm run start:prod
    envVars:
      - key: NODE_OPTIONS
        value: --max_old_space_size=512
      # add your secrets below in the Render dashboard or via sync:
      # - key: DATABASE_URL
      #   sync: false
